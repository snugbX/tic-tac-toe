name: Publicar no GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v6

      - name: Preparar os arquivos do site
        run: |
          mkdir -p _site/sounds
          cp index.html style.css script.js supabase-config.js service-worker.js manifest.json icon-192.png icon-512.png _site/
          cp sounds/click_human.wav sounds/click_ai.mp3 sounds/win.mp3 sounds/lose.mp3 sounds/draw.mp3 _site/sounds/

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
